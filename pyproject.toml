[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "eportem"
version = "0.1.0.dev0"
description = "Automates clocking in and out on ePortem (Spanish working-time records)"
readme = "README.md"
requires-python = ">=3.13"
license-files = ["LICENSE"]
# Exact pins for deployment are in requirements.txt (what run.sh and CI install).
dependencies = [
    "python-dotenv>=1.2",
    "requests>=2.32",
    "selenium>=4.40",
]

[project.scripts]
eportem = "eportem.cli:main"

[tool.setuptools.packages.find]
include = ["eportem*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
# tests/browser/ drives a real headless Chromium against the fake ePortem; it
# skips itself when no browser can start. `make test-fast` leaves it out.

[tool.coverage.run]
branch = true
source = ["."]
omit = ["tests/*", ".venv/*", "venv/*"]

[tool.coverage.report]
skip_empty = true
show_missing = false

[tool.ruff]
target-version = "py313"
line-length = 120
extend-exclude = ["venv", "capture", "diagnostics"]

[tool.ruff.lint]
# pyflakes, pycodestyle, bugbear, import order, pyupgrade, bandit (security)
select = ["E", "W", "F", "B", "I", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests use asserts and fake credentials on purpose.
"tests/*" = ["S101", "S103", "S104", "S105", "S106", "S108", "S603", "S607"]

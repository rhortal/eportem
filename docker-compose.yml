# ePortem: copy .env.example to .env, set EPORTEM_SECRET_KEY
# (`docker compose run --rm eportem python -m eportem config new-key`), then:
#   docker compose up -d
#   docker compose exec eportem python -m eportem create-admin YOUR_NAME
# To try it without a real ePortem account, start the fake too and point the
# service at it (EPORTEM_TARGET_URL=http://fake-eportem:8081 in .env):
#   docker compose --profile dev up -d      (demo account DEMO / demo-password)
services:
  eportem:
    build: .
    image: eportem-local:latest   # built here; never pulled
    restart: unless-stopped
    labels:
      # Auto-updaters (Watchtower) must not replace a locally built image from a registry.
      com.centurylinklabs.watchtower.enable: "false"
    env_file:
      - path: .env
        required: false   # so `docker compose config` works before .env exists
    ports:
      - "${EPORTEM_PUBLISH:-127.0.0.1:8080}:8080"
    volumes:
      - eportem-data:/data
    # Chromium needs more shared memory than Docker's 64 MB default.
    shm_size: "512m"
    mem_limit: "1g"

  fake-eportem:
    profiles: ["dev"]
    image: eportem-local:latest
    restart: unless-stopped   # survive a host reboot, like the service
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    command: ["python", "-m", "fake_eportem", "--host", "0.0.0.0", "--port", "8081",
              "--account", "DEMO:demo-password", "--recaptcha"]
    healthcheck:
      disable: true   # the image's check is for the service's port
    expose:
      - "8081"

  # --- Error reports (optional): GlitchTip, free and open source, Sentry-compatible.
  #   docker compose --profile errors up -d
  #   docker compose exec glitchtip ./manage.py createsuperuser
  # Open it (GLITCHTIP_PUBLISH, default http://127.0.0.1:8000), create an
  # organisation and a project, and set EPORTEM_SENTRY_DSN in .env to the
  # project's DSN with its host changed to glitchtip:8000, e.g.
  #   EPORTEM_SENTRY_DSN=http://<key>@glitchtip:8000/1
  # so reports stay on the Docker network. GlitchTip also has heartbeat
  # monitors: create one and put its URL in EPORTEM_HEARTBEAT_URL (it notices a
  # stopped eportem container; use an outside service to notice a dead host).
  glitchtip-db:
    profiles: ["errors"]
    image: postgres:18
    restart: unless-stopped
    command: -c max_locks_per_transaction=512
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust   # only reachable on this compose network
    volumes:
      - glitchtip-db:/var/lib/postgresql

  glitchtip:
    profiles: ["errors"]
    image: glitchtip/glitchtip:7
    restart: unless-stopped
    depends_on: [glitchtip-db]
    environment:
      DATABASE_URL: postgres://postgres:postgres@glitchtip-db:5432/postgres
      VALKEY_URL: ""                     # no Valkey: Postgres holds the queue and cache
      SECRET_KEY: ${GLITCHTIP_SECRET_KEY:?set GLITCHTIP_SECRET_KEY in .env (openssl rand -hex 32)}
      GLITCHTIP_DOMAIN: ${GLITCHTIP_DOMAIN:-http://127.0.0.1:8000}
      DEFAULT_FROM_EMAIL: ${GLITCHTIP_FROM_EMAIL:-glitchtip@example.com}
      EMAIL_URL: ${GLITCHTIP_EMAIL_URL:-consolemail://}
      ENABLE_USER_REGISTRATION: "False"  # only the superuser you create, and people they invite
      GLITCHTIP_ENABLE_LOGS: "False"
    ports:
      - "${GLITCHTIP_PUBLISH:-127.0.0.1:8000}:8000"
    volumes:
      - glitchtip-uploads:/code/uploads
    mem_limit: "768m"

volumes:
  eportem-data:
  glitchtip-db:
  glitchtip-uploads:

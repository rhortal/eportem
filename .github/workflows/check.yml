# Lint and tests on every push and pull request. Gitea Actions reads
# .github/workflows too, so this one file serves both forges.
name: check

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest --cov --cov-report=term:skip-covered
      - name: Coverage floor for eportem/
        run: python -m coverage report --include='eportem/*' --fail-under=85

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t eportem:ci .
      - name: Smoke test
        run: |
          key=$(docker run --rm eportem:ci python -m eportem config new-key)
          docker run --rm -e EPORTEM_SECRET_KEY="$key" eportem:ci python -m eportem config check
          docker run -d --name ept -e EPORTEM_SECRET_KEY="$key" -p 8080:8080 eportem:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/healthz && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/readyz
